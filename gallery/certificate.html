<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noble Collection Certificate</title><style>body{margin:0;background:#101821;color:#e9d6ad;font:16px Georgia,serif;display:grid;place-items:center;min-height:100vh}.paper{box-sizing:border-box;width:min(860px,94vw);padding:45px;border:double 6px #b79a61;text-align:center;background:radial-gradient(ellipse,#253444,#121c29);box-shadow:0 15px 60px #0007}h1{font-weight:400;font-size:clamp(26px,5vw,52px);margin:24px 0}h2{font-size:clamp(22px,4vw,34px);font-weight:400}p{color:#b9c1ce;line-height:1.6}.mark{font-size:55px}.kicker{letter-spacing:4px;font:11px system-ui;color:#ceb67e}.seal{border:double 4px #b79a61;width:90px;height:90px;display:grid;place-items:center;border-radius:50%;margin:24px auto;font-size:25px}.line{border-top:1px solid #b79a6166;margin:24px 0;padding:16px;font:12px system-ui;letter-spacing:1px}button,a{color:#d9c18e;background:#172536;border:1px solid #b79a61;border-radius:5px;padding:10px 15px;text-decoration:none;font:13px system-ui;cursor:pointer}small{display:block;font:10px system-ui;color:#a3afbe;margin-top:20px}@media print{body{background:white;color:#332d22;min-height:0}.paper{background:white;color:#332d22;box-shadow:none;width:100%;margin-top:10mm}.paper p,.paper small{color:#554b3d}button,a{display:none}}</style></head><body><article class="paper" id="paper"><div class="kicker">THE NOBLE COLLECTION</div><div class="mark">◇</div><h1>Certificate of Collection</h1><h2 id="name">Loading</h2><p id="detail"></p><div class="seal">MS</div><div class="line" id="serial"></div><button onclick="window.print()">Print / save PDF</button> <a href="./index.html">Return to gallery</a><small>Virtual collectible record · Not a proof of real purchase or manufacture.</small></article><script type="module">import{catalog,load,ownsInstalled}from'../market/store.mjs';const id=new URLSearchParams(location.search).get('asset'),p=catalog.find(x=>x.id===id),o=load().orders.find(o=>o.stage===3&&o.lines.some(x=>x.id===id));let record=null;try{record=JSON.parse(localStorage.getItem('mystuff.collection.v1')||'{}')[id]}catch{}const acquired=p&&(o||ownsInstalled(id));document.getElementById('name').textContent=acquired?p.name:'No collection record';document.getElementById('detail').textContent=acquired?(record?.installed?'Installed in the private collection':'Delivered to the private collection')+' · '+p.spec:'Complete an acquisition to issue a certificate.';document.getElementById('serial').textContent=acquired?p.id+' / '+(o?.id||'SHOWROOM ACQUISITION')+' / '+(record?.updatedAt||new Date(o.createdAt).toISOString()).slice(0,10):'NOT ISSUED';document.querySelector('button').disabled=!acquired;</script></body></html>
