<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyStuff / Original technical documents</title><style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#e1e9ed;font:14px system-ui;line-height:1.5}main{max-width:820px;margin:auto;padding:24px}header{border-bottom:1px solid #566779;padding-bottom:16px}h1{font:32px Georgia;color:#f0dfb7;margin:10px 0}h2{font:22px Georgia;color:#e2d1a9;margin:0 0 8px}a{color:#a9d6e5;text-decoration:none}a:hover{text-decoration:underline}.kicker{color:#bda77b;font-size:10px;letter-spacing:2px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0}.nav a{padding:8px 12px;border:1px solid #526478;border-radius:6px}.card{padding:18px;background:#1a2938;border:1px solid #405365;border-radius:8px;margin:12px 0}.doc{display:block;border-top:1px solid #435567;padding:12px 0}.doc strong{display:block;color:#c5e7ed}.doc span,p{color:#aabcc8;font-size:12px}.archive{font-size:11px;color:#aabcc8}.geometry{padding:12px;background:#12222e;border-left:2px solid #baa570}button{font:inherit}footer{font-size:11px;color:#8e9dac;margin-top:20px}</style></head><body><main><header><a href="/market/index.html">‹ MyStuff Market</a><div class="kicker">REFERENCE LIBRARY / ORIGINAL SOURCES</div><h1 id="title">Technical documents</h1><p>Manufacturer-hosted references, not republished PDFs. Open in a new tab.</p></header><nav class="nav" id="nav"></nav><div id="cards"></div><footer>Existing MyStuff dossiers are preserved only as optional archives. Exploded models are virtual illustrations, not physical disassembly instructions.</footer></main><script type="module">import {references} from './references.mjs';const id=new URLSearchParams(location.search).get('asset');const entries=Object.entries(references);const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('nav').innerHTML='<a href="./index.html">All</a>'+entries.map(([k,v])=>'<a href="?asset='+k+'">'+esc(v.name)+'</a>').join('');$('cards').innerHTML=entries.filter(([k])=>!references[id]||k===id).map(([k,v])=>'<article class="card"><div class="kicker">'+k+'</div><h2>'+esc(v.name)+'</h2><p>'+esc(v.scope)+'</p>'+v.docs.map(d=>'<a class="doc" href="'+esc(d[1])+'" target="_blank" rel="noopener noreferrer"><strong>'+esc(d[0])+' ↗</strong><span>'+esc(d[2])+'</span></a>').join('')+'<p class="geometry">Model reference: '+esc(v.geometry)+'</p><a class="archive" href="'+v.archive+'" target="_blank" rel="noopener">MyStuff archive (optional) ↗</a></article>').join('');</script></body></html>
